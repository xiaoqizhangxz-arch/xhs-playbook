[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-os"
version = "0.1.0"
description = "AI-powered Xiaohongshu growth advisor — knowledge-driven diagnosis and weekly briefs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["revenue_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
