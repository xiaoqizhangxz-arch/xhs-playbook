[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-playbook"
version = "0.1.0"
description = "XHS Playbook — AI-powered growth advisor for Xiaohongshu creators. Powered by 6,400+ knowledge objects from XHS official courses & livestreams."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["revenue_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
